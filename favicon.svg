<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    mac-clock favicon: a minimal analog clock face with 12 at top.
    Black ring + two hands on a translucent face — readable at 16x16.
    No radial fill — works as favicon in both light and dark browser chrome.
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1a1c"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
  </defs>
  <!-- background tile — adapts to theme; uses currentColor inheritance trick via mask -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#g)"/>
  <!-- face -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#f5f5f7" stroke-width="2" opacity="0.92"/>
  <!-- 12 / 3 / 6 / 9 cardinals -->
  <circle cx="32" cy="11" r="1.5" fill="#f5f5f7"/>
  <circle cx="53" cy="32" r="1.5" fill="#f5f5f7"/>
  <circle cx="32" cy="53" r="1.5" fill="#f5f5f7"/>
  <circle cx="11" cy="32" r="1.5" fill="#f5f5f7"/>
  <!-- hands: pointing to ~10:10 (classic) -->
  <line x1="32" y1="32" x2="20" y2="22" stroke="#f5f5f7" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="32" x2="42" y2="20" stroke="#f5f5f7" stroke-width="2" stroke-linecap="round"/>
  <circle cx="32" cy="32" r="2" fill="#7c5cff"/>
</svg>